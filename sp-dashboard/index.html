    const updateBarChart = () => {
      const unit = document.getElementById('bar-chart-unit').value;
      const display = document.getElementById('bar-chart-display').value;
      const count = getChartCount(unit);
      const today = new Date();
      const todayStr = toLocalDateStr(today);

      // Build a flat map of date -> total ms from all tasks (including hidden projects)
      const dayTotals = {};
      cachedTasks.forEach(task => {
        const entries = task.timeSpentOnDay || {};
        for (const [date, ms] of Object.entries(entries)) {
          dayTotals[date] = (dayTotals[date] || 0) + ms;
        }
      });

      let chartData;
      // Rest day = last day of the week = day before week-start
      const weekStartDay = parseInt(document.getElementById('week-start-day').value, 10);
      const restDay = (weekStartDay + 6) % 7; // 0=Sun..6=Sat

      if (unit === 'days') {
        const days = count;
        const startObj = new Date(today);
        startObj.setDate(today.getDate() - days + 1);
        const dateRange = getDatesInRange(toLocalDateStr(startObj), todayStr);
        const restIndices = new Set();
        dateRange.forEach((d, i) => {
          if (new Date(d + 'T00:00:00').getDay() === restDay) restIndices.add(i);
        });
        chartData = {
          labels: dateRange.map(d => {
            const dt = new Date(d + 'T00:00:00');
            return days <= 7
              ? dt.toLocaleDateString(undefined, { weekday: 'short' })
              : dt.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
          }),
          data: dateRange.map(d => dayTotals[d] || 0),
          restIndices
        };
      } else if (unit === 'weeks') {
        // Last N weeks aligned to the user's chosen week-start day
        const labels = [];
        const data = [];
        const targetDay = parseInt(document.getElementById('week-start-day').value, 10);
        const daysBack = (today.getDay() - targetDay + 7) % 7;
        // Current week start
        const currentWeekStart = new Date(today);
        currentWeekStart.setDate(today.getDate() - daysBack);
        for (let w = count - 1; w >= 0; w--) {
          const weekStart = new Date(currentWeekStart);
          weekStart.setDate(currentWeekStart.getDate() - w * 7);
          const weekEnd = new Date(weekStart);
          weekEnd.setDate(weekStart.getDate() + 6);
          // Clamp the end to today for the current week
          const effectiveEnd = w === 0 && weekEnd > today ? today : weekEnd;
          const range = getDatesInRange(toLocalDateStr(weekStart), toLocalDateStr(effectiveEnd));
          let sum = 0;
          range.forEach(d => { sum += dayTotals[d] || 0; });
          const s = weekStart.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
          labels.push(s);
          data.push(sum);
        }
        chartData = { labels, data };
      } else if (unit === 'months') {
        const labels = [];
        const data = [];
        for (let m = count - 1; m >= 0; m--) {
          const monthDate = new Date(today.getFullYear(), today.getMonth() - m, 1);
          const year = monthDate.getFullYear();
          const month = monthDate.getMonth();
          const label = monthDate.toLocaleDateString(undefined, { month: 'short', year: '2-digit' });
          // Sum all days in this month
          let sum = 0;
          for (const [date, ms] of Object.entries(dayTotals)) {
            const d = new Date(date + 'T00:00:00');
            if (d.getFullYear() === year && d.getMonth() === month) {
              sum += ms;
            }
          }
          labels.push(label);
          data.push(sum);
        }
        chartData = { labels, data };
      }

      if (display === 'curve') {
        renderCurveChart(chartData, 'bar-chart-container', (v) => `${(v / 3600000).toFixed(1)}h`);
      } else {
        renderBarChartDirect(chartData, 'bar-chart-container', 'var(--c-primary, #03a9f4)', (v) => `${(v / 3600000).toFixed(1)}h`);
      }
    };

    const renderGenericBarChart = (chartData, containerId, color, formatFn) => {
      const container = document.getElementById(containerId);
      container.innerHTML = '';
      if (chartData.data.length === 0) return;
      
      const maxVal = Math.max(...chartData.data, 1); 
      const maxBars = 30;
      let step = Math.ceil(chartData.data.length / maxBars);
      for (let i = 0; i < chartData.data.length; i += step) {
        let chunkSum = 0;
        let chunkCount = 0;
        for (let j = 0; j < step && i + j < chartData.data.length; j++) {
          chunkSum += chartData.data[i+j];
          chunkCount++;
        }
        
        const val = step === 1 ? chunkSum : chunkSum / chunkCount; 
        const label = chartData.labels[i].substring(5);
        const heightPct = (val / maxVal) * 100;
        const displayVal = formatFn(val);

        const col = document.createElement('div');
        col.className = 'bar-col';
        col.innerHTML = `
          <div class="bar" style="height: ${heightPct}%; background: ${color};" data-val="${displayVal}"></div>
          <div class="bar-label" title="${chartData.labels[i]}">${label}</div>
        `;
        container.appendChild(col);
      }
      
      // Setup tooltip listeners for bars
      setupBarTooltip();
    };

    const renderCurveChart = (chartData, containerId, formatFn) => {
      const container = document.getElementById(containerId);
      container.innerHTML = '';
      if (!chartData || chartData.data.length < 2) return;
      const n = chartData.data.length;
      const maxVal = Math.max(...chartData.data, 1);
      const restSet = chartData.restIndices || new Set();

      const pad = { top: 10, right: 10, bottom: 28, left: 6 };
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('width', '100%');
      svg.setAttribute('height', '100%');
      svg.style.overflow = 'visible';
      container.appendChild(svg);

      // We need actual pixel dimensions
      const rect = container.getBoundingClientRect();
      const w = rect.width - pad.left - pad.right;
      const h = rect.height - pad.top - pad.bottom;

      // Map data to points
      const points = chartData.data.map((v, i) => ({
        x: pad.left + (i / (n - 1)) * w,
        y: pad.top + h - (v / maxVal) * h
      }));

      // Catmull-Rom to cubic bezier conversion
      const catmullRomPath = (pts) => {
        const tension = 0.3;
        let d = `M ${pts[0].x},${pts[0].y}`;
        for (let i = 0; i < pts.length - 1; i++) {
          const p0 = pts[Math.max(i - 1, 0)];
          const p1 = pts[i];
          const p2 = pts[i + 1];
          const p3 = pts[Math.min(i + 2, pts.length - 1)];
          const cp1x = p1.x + (p2.x - p0.x) * tension;
          const cp1y = p1.y + (p2.y - p0.y) * tension;
          const cp2x = p2.x - (p3.x - p1.x) * tension;
          const cp2y = p2.y - (p3.y - p1.y) * tension;
          d += ` C ${cp1x},${cp1y} ${cp2x},${cp2y} ${p2.x},${p2.y}`;
        }
        return d;
      };

      const pathD = catmullRomPath(points);

      // Area fill
      const areaPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      const areaD = pathD + ` L ${points[n - 1].x},${pad.top + h} L ${points[0].x},${pad.top + h} Z`;
      areaPath.setAttribute('d', areaD);
      areaPath.setAttribute('fill', 'var(--c-primary, #03a9f4)');
      areaPath.setAttribute('opacity', '0.12');
      svg.appendChild(areaPath);

      // Line
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      line.setAttribute('d', pathD);
      line.setAttribute('fill', 'none');
      line.setAttribute('stroke', 'var(--c-primary, #03a9f4)');
      line.setAttribute('stroke-width', '2');
      svg.appendChild(line);

      // Dots + invisible hover targets + labels
      const tooltip = document.getElementById('bar-tooltip');
      // Show ~6 evenly spaced labels
      const labelStep = Math.max(1, Math.floor(n / 6));

      points.forEach((pt, i) => {
        const isRest = restSet.has(i);
        const displayVal = formatFn(chartData.data[i]);

        // Visible dot
        const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        dot.setAttribute('cx', pt.x);
        dot.setAttribute('cy', pt.y);
        dot.setAttribute('r', '3');
        dot.setAttribute('fill', isRest ? 'var(--text-color-muted, #9e9e9e)' : 'var(--c-primary, #03a9f4)');
        dot.setAttribute('opacity', isRest ? '0.4' : '1');
        svg.appendChild(dot);

        // Larger invisible hover target
        const hitArea = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        hitArea.setAttribute('cx', pt.x);
        hitArea.setAttribute('cy', pt.y);
        hitArea.setAttribute('r', '10');
        hitArea.setAttribute('fill', 'transparent');
        hitArea.style.cursor = 'pointer';
        hitArea.addEventListener('mouseenter', () => {
          tooltip.textContent = `${chartData.labels[i]}: ${displayVal}`;
          tooltip.classList.add('visible');
          dot.setAttribute('r', '5');
        });
        hitArea.addEventListener('mousemove', (e) => {
          tooltip.style.left = (e.clientX + 8) + 'px';
          tooltip.style.top = (e.clientY - 12) + 'px';
        });
        hitArea.addEventListener('mouseleave', () => {
          tooltip.classList.remove('visible');
          dot.setAttribute('r', '3');
        });
        svg.appendChild(hitArea);

        // X-axis labels (sparse)
        if (i % labelStep === 0 || i === n - 1) {
          const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          label.setAttribute('x', pt.x);
          label.setAttribute('y', pad.top + h + 16);
          label.setAttribute('text-anchor', 'middle');
          label.setAttribute('fill', 'var(--text-color-muted, #9e9e9e)');
          label.setAttribute('font-size', '10');
          label.textContent = chartData.labels[i];
          svg.appendChild(label);
        }
      });
    };

    const renderBarChartDirect = (chartData, containerId, color, formatFn) => {
      const container = document.getElementById(containerId);
      container.innerHTML = '';
      if (!chartData || chartData.data.length === 0) return;
      const maxVal = Math.max(...chartData.data, 1);
      const restSet = chartData.restIndices || new Set();
      for (let i = 0; i < chartData.data.length; i++) {
        const val = chartData.data[i];
        const heightPct = (val / maxVal) * 100;
        const displayVal = formatFn(val);
        const isRest = restSet.has(i);
        const col = document.createElement('div');
        col.className = 'bar-col';
        col.innerHTML = `
          <div class="bar" style="height: ${heightPct}%; background: ${color};${isRest ? ' opacity: 0.3;' : ''}" data-val="${displayVal}"></div>
          <div class="bar-label" style="${isRest ? 'font-style: italic;' : ''}">${chartData.labels[i]}${isRest ? ' (rest)' : ''}</div>
        `;
        container.appendChild(col);
      }
      setupBarTooltip();
    };

    const setupBarTooltip = () => {
      const tooltip = document.getElementById('bar-tooltip');
      const bars = document.querySelectorAll('.bar-chart .bar');
      
      bars.forEach(bar => {
        bar.addEventListener('mouseenter', (e) => {
          tooltip.textContent = bar.getAttribute('data-val');
          tooltip.classList.add('visible');
        });
        
        bar.addEventListener('mousemove', (e) => {
          // Position tooltip at cursor with small offset
          tooltip.style.left = (e.clientX + 8) + 'px';
          tooltip.style.top = (e.clientY - 12) + 'px';
        });
        
        bar.addEventListener('mouseleave', () => {
          tooltip.classList.remove('visible');
        });
      });
    };

    // Map a day's tracked ms to a heatmap intensity level (0–4)
    const heatLevel = (ms) => {
      if (!ms || ms <= 0) return 0;
      const h = ms / 3600000;
      if (h < 1) return 1;
      if (h < 3) return 2;
      if (h < 5) return 3;
      return 4;
    };

    // Render a GitHub-style heatmap of time worked per day over the last year
    const renderHeatmap = () => {
      const grid = document.getElementById('heatmap-grid');
      const monthsRow = document.getElementById('heatmap-months');
      const weekdaysCol = document.getElementById('heatmap-weekdays');
      if (!grid || !monthsRow || !weekdaysCol) return;

      // Flat map of date -> total ms across all tasks (including hidden projects)
      const dayTotals = {};
      cachedTasks.forEach(task => {
        const entries = task.timeSpentOnDay || {};
        for (const [date, ms] of Object.entries(entries)) {
          dayTotals[date] = (dayTotals[date] || 0) + ms;
        }
      });

      const weekStartDay = parseInt(document.getElementById('week-start-day').value, 10);
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      // Start 364 days back, then snap to the start of that week
      const cursor = new Date(today);
      cursor.setDate(cursor.getDate() - 364);
      cursor.setDate(cursor.getDate() - ((cursor.getDay() - weekStartDay + 7) % 7));

      grid.innerHTML = '';
      monthsRow.innerHTML = '';
      let lastMonth = -1;
      while (cursor <= today) {
        const col = document.createElement('div');
        col.className = 'heatmap-col';

        // Month label appears on the first column of each month
        const monthLabel = document.createElement('div');
        monthLabel.className = 'heatmap-month';
        if (cursor.getMonth() !== lastMonth) {
          monthLabel.textContent = cursor.toLocaleDateString(undefined, { month: 'short' });
          lastMonth = cursor.getMonth();
        }
        monthsRow.appendChild(monthLabel);

        for (let r = 0; r < 7; r++) {
          const cell = document.createElement('div');
          cell.className = 'heatmap-cell';
          if (cursor > today) {
            cell.classList.add('heatmap-empty');
          } else {
            const dStr = toLocalDateStr(cursor);
            const ms = dayTotals[dStr] || 0;
            cell.classList.add('hl-' + heatLevel(ms));
            cell.setAttribute('data-val', `${formatDateShort(dStr)}: ${formatTime(ms)}`);
          }
          col.appendChild(cell);
          cursor.setDate(cursor.getDate() + 1);
        }
        grid.appendChild(col);
      }

      // Weekday labels (every other row) aligned to the chosen week-start day
      const names = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      weekdaysCol.innerHTML = '';
      for (let r = 0; r < 7; r++) {
        const lbl = document.createElement('div');
        lbl.className = 'heatmap-weekday';
        if (r % 2 === 1) lbl.textContent = names[(weekStartDay + r) % 7];
        weekdaysCol.appendChild(lbl);
      }

      // Cursor-following tooltip, reusing the shared bar-tooltip element
      const tooltip = document.getElementById('bar-tooltip');
      grid.querySelectorAll('.heatmap-cell[data-val]').forEach(cell => {
        cell.addEventListener('mouseenter', () => {
          tooltip.textContent = cell.getAttribute('data-val');
          tooltip.classList.add('visible');
        });
        cell.addEventListener('mousemove', (e) => {
          tooltip.style.left = (e.clientX + 8) + 'px';
          tooltip.style.top = (e.clientY - 12) + 'px';
        });
        cell.addEventListener('mouseleave', () => tooltip.classList.remove('visible'));
      });
    };

    // helper for normalizing a task's dueDay to day boundaries (UTC)
    const getDueBounds = (task) => {
      let dueStart = null;
      if (task.dueDay) {
        // parse original YYYY-MM-DD string – Date.parse yields UTC midnight
        const parsed = Date.parse(task.dueDay);
        if (!isNaN(parsed)) {
          dueStart = parsed; // no timezone shift
        }
      }
      const dueEnd = dueStart !== null ? dueStart + 86400000 - 1 : null;
      return { dueStart, dueEnd };
    };

    // process tasks/projects into metrics and update UI
    const processData = (tasksArr, projectsArr) => {
      cachedTasks = tasksArr;
      cachedProjects = projectsArr;
      // One-time migration: seed a single "All" group from the legacy global goals
      if (localStorage.getItem('sp-dashboard-groups') === null) {
        const lw = parseFloat(localStorage.getItem('sp-dashboard-goal-period'));
        const ld = parseFloat(localStorage.getItem('sp-dashboard-goal-today'));
        if (!isNaN(lw) || !isNaN(ld)) {
          saveGroups([{
            id: genGroupId(), name: 'All',
            weeklyGoalH: isNaN(lw) ? 0 : lw, dailyGoalH: isNaN(ld) ? 0 : ld,
            projectIds: projectsArr.filter(p => !p.isHiddenFromMenu).map(p => p.id),
            color: groupColorForIndex(0)
          }]);
        } else {
          saveGroups([]);
        }
      }
      // Compute "this week" range based on the week-start-day selector
      const endObj = new Date();
      const startObj = new Date();
      const targetDay = parseInt(document.getElementById('week-start-day').value, 10);
      const daysBack = (endObj.getDay() - targetDay + 7) % 7;
      startObj.setDate(endObj.getDate() - daysBack);
      const dateFromStr = toLocalDateStr(startObj);
      const dateToStr = toLocalDateStr(endObj);
      const dateRange = getDatesInRange(dateFromStr, dateToStr);
      console.log("[sp-dashboard] computed date range", dateFromStr, dateToStr, dateRange);

      // Compute previous 4 weeks for comparison (only matching elapsed days)
      const elapsedDays = dateRange.length;
      const workingDaysElapsed = Math.min(elapsedDays, 6);
      const prevWeekRanges = [];
      for (let w = 1; w <= 4; w++) {
        const pwStart = new Date(startObj);
        pwStart.setDate(pwStart.getDate() - 7 * w);
        const pwEnd = new Date(pwStart);
        pwEnd.setDate(pwStart.getDate() + elapsedDays - 1);
        prevWeekRanges.push(new Set(getDatesInRange(toLocalDateStr(pwStart), toLocalDateStr(pwEnd))));
      }


      // Yesterday string for today comparison
      const todayObj = new Date();
      const yesterdayObj = new Date(todayObj);
      yesterdayObj.setDate(todayObj.getDate() - 1);
      const yesterdayStr = toLocalDateStr(yesterdayObj);

      // Build lookup maps for faster processing
      const projectMap = {};
      projectsArr.forEach(p => projectMap[p.id] = p.title);

      const todayStr = toLocalDateStr(new Date());

      let metrics = {
        totalTimeSpent: 0,
        todayTimeSpent: 0,
        prevWeekTotals: [0, 0, 0, 0],
        yesterdayTimeSpent: 0,
        totalCompleted: 0,
        totalTasks: 0,
        overdueTasks: 0,
        lateCompleted: 0, // completed after due date
        unplannedCount: 0, // tasks without a dueDay
        workingDaysElapsed,
        weeklyData: { labels: dateRange, data: new Array(dateRange.length).fill(0) },
        projectData: {},
        projectTodayData: {},
      };

      const now = Date.now();
      // define end-of-range timestamp for per-day overdue calculations
      const rangeEndTime = new Date(dateToStr + "T23:59:59").getTime();

      const countedOverdue = new Set();
      tasksArr.forEach(task => {
        const keys = Object.keys(task.timeSpentOnDay || {});
        const overlap = keys.filter(k => dateRange.includes(k));
        // compute normalized due bounds (start of day / end of day)
        const { dueStart, dueEnd } = getDueBounds(task);
        if (!dueStart && !task.isDone) {
          console.log("[sp-dashboard] task missing dueDay and not done, full object:", task);
        }
        // diagnostic info
        console.log("[sp-dashboard] processing task", task.id, task.title,
                    "dueDay", task.dueDay,
                    "dueStartUTC", dueStart !== null ? new Date(dueStart).toISOString() : null,
                    "dueEndUTC", dueEnd !== null ? new Date(dueEnd).toISOString() : null,
                    "nowUTC", new Date(now).toISOString(),
                    "isDone", task.isDone, "doneOnUTC", task.doneOn ? new Date(task.doneOn).toISOString() : null,
                    "timeSpentOnDay keys", keys, "inRange", overlap);
        let taskTimeInRange = 0;
        const pName = task.projectId && projectMap[task.projectId] 
            ? projectMap[task.projectId] 
            : 'Uncategorized';

        // count unplanned only if dueDay is missing
        if (!dueStart && !task.isDone) {
          metrics.unplannedCount++;
        }
        // determine overdue state using day-end comparison
        let isOverdue = false;
        let isLate = false;
        if (dueStart !== null) {
          if (!task.isDone && now > dueEnd) {
            isOverdue = true;
          } else if (task.isDone && task.doneOn && task.doneOn > dueEnd) {
            isOverdue = true;
            isLate = true;
          }
        }
        if (isOverdue) {
          metrics.overdueTasks++;
          if (isLate) {
            metrics.lateCompleted++;
          }
          countedOverdue.add(task.id);
        }

        dateRange.forEach((dateStr, index) => {
          const dayStart = new Date(dateStr + "T00:00:00").getTime();
          const dayEnd = dayStart + 86400000 - 1;

          // Time Spent Logging
          const spentOnDate = task.timeSpentOnDay && task.timeSpentOnDay[dateStr];
          if (spentOnDate) {
            metrics.weeklyData.data[index] += spentOnDate;
            taskTimeInRange += spentOnDate;
          }

          // Completed Logic
          if (task.isDone && task.doneOn && task.doneOn >= dayStart && task.doneOn <= dayEnd) {
          }
        });
        
        // Tally Project Time and Total Tasks if active in window
        if (taskTimeInRange > 0) {
          metrics.totalTimeSpent += taskTimeInRange;
          if (!metrics.projectData[pName]) metrics.projectData[pName] = 0;
          metrics.projectData[pName] += taskTimeInRange;
        }

        // Tally today's and yesterday's time (always, regardless of selected period)
        if (task.timeSpentOnDay) {
          if (task.timeSpentOnDay[todayStr]) {
            metrics.todayTimeSpent += task.timeSpentOnDay[todayStr];
            metrics.projectTodayData[pName] = (metrics.projectTodayData[pName] || 0) + task.timeSpentOnDay[todayStr];
          }
          if (task.timeSpentOnDay[yesterdayStr]) {
            metrics.yesterdayTimeSpent += task.timeSpentOnDay[yesterdayStr];
          }
          // Tally previous 4 weeks time
          for (const [day, ms] of Object.entries(task.timeSpentOnDay)) {
            for (let w = 0; w < 4; w++) {
              if (prevWeekRanges[w].has(day)) {
                metrics.prevWeekTotals[w] += ms;
              }
            }
          }
        }

        // count tasks that had activity OR were completed OR are due (in range)
        const taskCompletedInRange = task.isDone && task.doneOn && dateRange.includes(toLocalDateStr(new Date(task.doneOn)));
        const taskDueInRange = task.dueDay && dateRange.includes(task.dueDay);
        if (taskTimeInRange > 0 || taskCompletedInRange || taskDueInRange) {
          metrics.totalTasks++;
          if (taskCompletedInRange) {
            metrics.totalCompleted++;
            console.log("[sp-dashboard] incrementing totalCompleted for", task.id, task.title, "- now at", metrics.totalCompleted);
          }
        }
      });

      // After initial pass, some tasks may have gained dueDay later (see logs)
      tasksArr.forEach(task => {
        if (!countedOverdue.has(task.id)) {
          const { dueStart, dueEnd } = getDueBounds(task);
          if (!task.isDone && dueStart !== null && now > dueEnd) {
            metrics.overdueTasks++;
            const pName = task.projectId && projectMap[task.projectId]
                        ? projectMap[task.projectId]
                        : 'Uncategorized';
            countedOverdue.add(task.id);
          }
        }
      });
      // recompute unplannedCount after potential dueDay additions
      metrics.unplannedCount = tasksArr.reduce((cnt, t) => {
        const { dueStart } = getDueBounds(t);
        return cnt + ((!t.isDone && !dueStart) ? 1 : 0);
      }, 0);
      
      // Diagnostic: log all done tasks and final tally
      const doneTasks = tasksArr.filter(t => t.isDone);
      const doneWithoutTimestamp = doneTasks.filter(t => !t.doneOn);
      console.log("[sp-dashboard] FINAL METRICS: totalCompleted=", metrics.totalCompleted, "totalTasks=", metrics.totalTasks);
      console.log("[sp-dashboard] Done tasks in array (count=" + doneTasks.length + "):", doneTasks.map(t => ({ id: t.id, title: t.title, doneOn: t.doneOn })));
      if (doneWithoutTimestamp.length > 0) {
        console.warn("[sp-dashboard] WARNING: done tasks missing doneOn timestamp:", doneWithoutTimestamp.map(t => ({ id: t.id, title: t.title })));
      }
      
      // report any overdue tasks that had no time entries (might explain zero stats)
      const overdueNoTime = tasksArr.filter(t => {
        const keys = Object.keys(t.timeSpentOnDay || {});
        const { dueStart, dueEnd } = getDueBounds(t);
        return (!t.isDone && dueStart !== null && dueEnd < rangeEndTime && keys.length === 0);
      }).map(t => t.id);
      if (overdueNoTime.length) {
        console.log("[sp-dashboard] overdue tasks with no time entries", overdueNoTime);
      }
      updateDashboardUI(metrics);
    };

    // expose key utilities for testing (JSDOM environment won't execute script tags normally)
    window.formatTime = formatTime;
    window.formatDateShort = formatDateShort;
    window.toLocalDateStr = toLocalDateStr;
    window.getDatesInRange = getDatesInRange;
    window.processData = processData;
    window.loadGroups = loadGroups;
    window.saveGroups = saveGroups;
    window.computeGroupStats = computeGroupStats;
    window.getTotalWeeklyGoalH = getTotalWeeklyGoalH;
    window.getTotalDailyGoalH = getTotalDailyGoalH;
    window.updateBarChart = updateBarChart;
    window.renderHeatmap = renderHeatmap;

    // --- SP INTEGRATION / NATIVE IFRAME COMMS ---
    const pullDataFromSP = async () => {
      console.log("[sp-dashboard] pullDataFromSP invoked, PluginAPI?", !!window.PluginAPI);
      try {
        if (window.PluginAPI) {
          const activeTasks = await window.PluginAPI.getTasks() || [];
          console.log("[sp-dashboard] received activeTasks count", activeTasks.length);
          const activeTasksDone = activeTasks.filter(t => t.isDone);
          console.log("[sp-dashboard] activeTasks done:", JSON.stringify(activeTasksDone.map(t => ({ id: t.id, title: t.title, doneOn: t.doneOn })), null, 2));
          
          const archivedTasks = await window.PluginAPI.getArchivedTasks() || [];
          console.log("[sp-dashboard] received archivedTasks count", archivedTasks.length);
          const archivedTasksDone = archivedTasks.filter(t => t.isDone);
          console.log("[sp-dashboard] archivedTasks done:", JSON.stringify(archivedTasksDone.map(t => ({ id: t.id, title: t.title, doneOn: t.doneOn })), null, 2));
          
          // Deduplicate tasks: use Map to ensure each task ID appears only once
          // Active tasks take precedence over archived (appear later in spread, so overwrite)
          const taskMap = new Map();
          const duplicateIds = new Set();
          archivedTasks.forEach(task => {
            if (taskMap.has(task.id)) {
              duplicateIds.add(task.id);
            }
            taskMap.set(task.id, task);
          });
          activeTasks.forEach(task => {
            if (taskMap.has(task.id)) {
              duplicateIds.add(task.id);
            }
            taskMap.set(task.id, task);
          });
          cachedTasks = Array.from(taskMap.values());
          console.log("[sp-dashboard] after deduplication, unique tasks count", cachedTasks.length);
          if (duplicateIds.size > 0) {
            console.log("[sp-dashboard] duplicate task IDs found:", Array.from(duplicateIds));
          }
          const finalDoneCount = cachedTasks.filter(t => t.isDone).length;
          console.log("[sp-dashboard] final cachedTasks done count:", finalDoneCount);
          cachedProjects = await window.PluginAPI.getAllProjects() || [];
          console.log("[sp-dashboard] received projects count", cachedProjects.length);
          processData(cachedTasks, cachedProjects);
        } else {
          console.warn("[sp-dashboard] PluginAPI missing inside pullDataFromSP");
        }
      } catch (err) {
        console.error("[sp-dashboard] Dashboard failed to fetch SP data:", err);
      }
    };

    // Listen for the light refresh trigger from plugin.js
    window.addEventListener('message', (event) => {
      console.log("[sp-dashboard] message event received in iframe");
      console.log(event.data)
      if (event.data && event.data.type === 'SP_STATE_CHANGED') {
        pullDataFromSP();
      }
    });

    // Periodically refresh so the dashboard stays current even when no
    // action fires (e.g. a running timer just ticking up over time).
    setInterval(() => {
      if (window.PluginAPI) {
        pullDataFromSP();
      }
    }, 60000);

    // Initial Bootstrap & Fallback Data Generation
    setTimeout(() => {
      console.log("[sp-dashboard] bootstrap timeout fired; PluginAPI exists?", !!window.PluginAPI);
      if (window.PluginAPI) {
        pullDataFromSP();
      } else {
        console.log("[sp-dashboard] No PluginAPI detected. Loading mock data...");
        
        // Simulating the exact screenshot payload
        const dates = [
          new Date('2026-02-22').toISOString().split('T')[0],
          new Date('2026-02-21').toISOString().split('T')[0],
          new Date('2026-02-20').toISOString().split('T')[0],
          new Date('2026-02-19').toISOString().split('T')[0]
        ];

        cachedProjects = [
          { id: "p1", title: "Website Redesign", theme: { primary: "#42a5f5" } },
          { id: "p2", title: "Marketing Campaign", theme: { primary: "#66bb6a" } }
        ];

        cachedTasks = [
          {
            id: "t1", parentId: null, title: "Create Figma Mockups", isDone: true, doneOn: new Date('2026-02-22T10:00Z').getTime(), projectId: "p1",
            timeSpentOnDay: { [dates[0]]: 14400000 /* 4h */, [dates[1]]: 7200000 /* 2h */ }
          },
          {
            id: "t2", parentId: null, title: "General Admin", isDone: false, projectId: null,
            timeSpentOnDay: { [dates[0]]: 3600000 /* 1h */ }
          },
          {
            id: "t3", parentId: null, title: "Draft Email Copy", isDone: true, doneOn: new Date('2026-02-20T10:00Z').getTime(), projectId: "p2",
            timeSpentOnDay: { [dates[2]]: 18000000 /* 5h */ }
          },
          {
            id: "t4", parentId: null, title: "Setup Database", isDone: false, projectId: "p1",
            timeSpentOnDay: { [dates[3]]: 10800000 /* 3h */ }, dueDay: "2026-02-18" // Overdue
          },
          {
            id: "t5", parentId: null, title: "Write Documentation", isDone: false, projectId: "p1",
            timeSpentOnDay: {}, // No time logged in this period – not included in denominator
            dueDay: "2026-02-28" // Future due date
          },
          {
            id: "t6", parentId: null, title: "API Integration", isDone: false, projectId: "p1",
            timeSpentOnDay: { [dates[0]]: 5400000 /* 1.5h */ }, dueDay: "2026-02-17" // Overdue with time logged
          },
          {
            id: "t6-1", parentId: "t6", title: "Fix authentication endpoint", isDone: true, doneOn: new Date('2026-02-21T14:00Z').getTime(), projectId: "p1",
            timeSpentOnDay: { [dates[1]]: 7200000 /* 2h */ } // Child task (subtask of t6)
          },
          {
            id: "t7", parentId: null, title: "Review Code", isDone: true, doneOn: new Date('2026-02-21T15:00Z').getTime(), projectId: "p1",
            timeSpentOnDay: { [dates[1]]: 3600000 /* 1h */ }, dueDay: "2026-02-19" // Late - completed 2 days after due date
          }
        ];

        processData(cachedTasks, cachedProjects);
      }
    }, 500);

  </script>
