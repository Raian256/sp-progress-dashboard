<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 24 24" fill="currentColor">
  <!--
    Dashboard Plugin Icon

    Native to Super Productivity's Material iconography: the canonical
    "dashboard" glyph (a four-panel grid). Drawn with fill="currentColor"
    and no hard-coded colour, so SP's plugin-icon component (which forces
    `fill: currentColor` on the inlined SVG) tints it with the theme's icon
    colour — dark on light themes, light on dark — matching the built-in
    nav icons instead of standing out. Avoid stroke-based shapes here: SP
    only overrides fill, so a hard-coded stroke would ignore the theme.
  -->
  <path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"></path>
</svg>
